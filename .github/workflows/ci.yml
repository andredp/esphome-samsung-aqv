name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-tests:
    name: C++ Tests (doctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and run tests
        run: |
          g++ -std=c++17 -O2 -Werror -Wall -o tests/test_protocol tests/test_protocol.cpp
          tests/test_protocol

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: cppcheck --language=c++ --enable=warning,performance,portability --error-exitcode=1 --std=c++17 --suppress=missingIncludeSystem --suppress=missingInclude components/samsung_aqv/

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: find components tests tools -name '*.cpp' -o -name '*.h' | grep -v doctest.h | grep -v test_vectors.h | xargs clang-format --dry-run --Werror

  esphome-compile:
    name: ESPHome ${{ matrix.esphome }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - esphome: "2025.5.0"
            platform: ESP8266
            yaml: tests/test_esphome.yaml
          - esphome: ""
            platform: BK7231N
            yaml: tests/test_esphome_bk7231n.yaml
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome${{ matrix.esphome && format('=={0}', matrix.esphome) || '' }}
      - name: Compile
        run: esphome compile ${{ matrix.yaml }}
